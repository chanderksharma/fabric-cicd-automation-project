# instance_pool_id is rewritten per environment by the spark_pool section of
# workspace/parameter.yml. Do not replace it with a real GUID.
instance_pool_id: 00000000-0000-0000-0000-0000000000sp
driver_cores: 4
driver_memory: 28g
executor_cores: 4
executor_memory: 28g
dynamic_executor_allocation:
  enabled: true
  min_executors: 1
  max_executors: 2
runtime_version: '1.3'
enable_native_execution_engine: false
spark_conf:
  spark.sql.parquet.vorder.enabled: 'true'
  spark.databricks.delta.optimizeWrite.enabled: 'true'
  spark.databricks.delta.optimizeWrite.binSize: '1073741824'
