# fabric-cicd parameterisation.
#
# Every value that differs between dev, test and prod lives here. Item source
# files are committed with the DEV value inline so that a data engineer can open
# the workspace in dev, edit, and commit back without breaking anything - the
# dev entry below is therefore an identity replacement in most rules.
#
# Rules:
#   find_replace      - literal or regex string substitution inside item files
#   key_value_replace - JSONPath-targeted substitution inside JSON item files
#   spark_pool        - remaps an Environment's custom pool per environment
#
# Dynamic values resolved by fabric-cicd at publish time:
#   $workspace.id                       target workspace GUID
#   $items.<Type>.<name>.id             GUID of an item published in this run
# Using these keeps real GUIDs out of source control entirely.

find_replace:
  # ---------------------------------------------------------------------------
  # Landing storage account that Bronze ingestion reads from.
  # ---------------------------------------------------------------------------
  - find_value: "https://stcontosolandingdev.dfs.core.windows.net"
    replace_value:
      dev: "https://stcontosolandingdev.dfs.core.windows.net"
      test: "https://stcontosolandingtest.dfs.core.windows.net"
      prod: "https://stcontosolandingprod.dfs.core.windows.net"
    item_type:
      - Notebook
      - DataPipeline

  # ---------------------------------------------------------------------------
  # Fabric connection used by the Copy activity. Connections are NOT managed by
  # the Terraform provider; the GUIDs below are created once per environment by
  # scripts/bootstrap and recorded here.
  # ---------------------------------------------------------------------------
  - find_value: "aaaaaaaa-0000-0000-0000-000000000001"
    replace_value:
      dev: "aaaaaaaa-0000-0000-0000-000000000001"
      test: "aaaaaaaa-0000-0000-0000-000000000002"
      prod: "aaaaaaaa-0000-0000-0000-000000000003"
    item_type:
      - DataPipeline

  # ---------------------------------------------------------------------------
  # Workspace and item GUIDs. Resolved dynamically, so the same three lines work
  # for every environment and no GUID is ever hardcoded per environment.
  # ---------------------------------------------------------------------------
  - find_value: "00000000-0000-0000-0000-0000000000ws"
    replace_value:
      dev: "$workspace.id"
      test: "$workspace.id"
      prod: "$workspace.id"

  - find_value: "00000000-0000-0000-0000-0000000000br"
    replace_value:
      dev: "$items.Lakehouse.lh_bronze.id"
      test: "$items.Lakehouse.lh_bronze.id"
      prod: "$items.Lakehouse.lh_bronze.id"

  - find_value: "00000000-0000-0000-0000-0000000000gd"
    replace_value:
      dev: "$items.Lakehouse.lh_gold.id"
      test: "$items.Lakehouse.lh_gold.id"
      prod: "$items.Lakehouse.lh_gold.id"

  - find_value: "00000000-0000-0000-0000-0000000000ev"
    replace_value:
      dev: "$items.Environment.env_shared.id"
      test: "$items.Environment.env_shared.id"
      prod: "$items.Environment.env_shared.id"

  - find_value: "00000000-0000-0000-0000-0000000000n1"
    replace_value:
      dev: "$items.Notebook.Ingest_Bronze.id"
      test: "$items.Notebook.Ingest_Bronze.id"
      prod: "$items.Notebook.Ingest_Bronze.id"

  - find_value: "00000000-0000-0000-0000-0000000000n2"
    replace_value:
      dev: "$items.Notebook.Transform_Gold.id"
      test: "$items.Notebook.Transform_Gold.id"
      prod: "$items.Notebook.Transform_Gold.id"

  # ---------------------------------------------------------------------------
  # SQL analytics endpoint backing the Direct Lake semantic model.
  # ---------------------------------------------------------------------------
  - find_value: "SQL_ENDPOINT_PLACEHOLDER"
    replace_value:
      dev: "xxxxxxxxxxxx.datawarehouse.fabric.microsoft.com"
      test: "yyyyyyyyyyyy.datawarehouse.fabric.microsoft.com"
      prod: "zzzzzzzzzzzz.datawarehouse.fabric.microsoft.com"
    item_type:
      - SemanticModel
    file_path:
      - "/sm_sales.SemanticModel/definition/expressions.tmdl"

key_value_replace:
  # Ingestion batch size: small in dev to keep the F2 responsive, full size in
  # prod.
  - find_key: $.properties.parameters.p_batch_size.defaultValue
    replace_value:
      dev: 1000
      test: 10000
      prod: 250000
    item_type:
      - DataPipeline

  # Retry policy hardens as the pipeline moves towards prod.
  - find_key: $.properties.activities[0].policy.retry
    replace_value:
      dev: 0
      test: 1
      prod: 3
    item_type:
      - DataPipeline

spark_pool:
  # The placeholder below is what the committed Environment definition carries.
  # dev and test run on the capacity-level starter pool; prod runs on a named
  # workspace-scoped custom pool created by the platform team.
  - instance_pool_id: "00000000-0000-0000-0000-0000000000sp"
    replace_value:
      dev:
        type: Capacity
        name: contoso-fab-starter
      test:
        type: Capacity
        name: contoso-fab-starter
      prod:
        type: Workspace
        name: pool-prod-medium
