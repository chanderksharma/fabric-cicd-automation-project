version: 2

updates:
  # Keeps action pins current. Set to "same-major" so pinned SHAs are bumped
  # without silently jumping a major version.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: terraform
    directory: /infra/platform
    schedule:
      interval: weekly
    labels:
      - dependencies
      - terraform

  - package-ecosystem: terraform
    directory: /infra/workspace
    schedule:
      interval: weekly
    labels:
      - dependencies
      - terraform

  - package-ecosystem: pip
    directory: /src
    schedule:
      interval: weekly
    labels:
      - dependencies
      - python
