name: bootstrap

# Establishes the permanent secretless deployment path from a pre-authorized
# bootstrap service principal. Both Azure identities authenticate through
# GitHub OIDC; no Azure client secret is used.

on:
  workflow_dispatch:
    inputs:
      storage_account_name:
        description: Globally unique Terraform state storage account name
        required: true
        default: stcontosofabtfstate
        type: string
      state_resource_group:
        description: Resource group for Terraform state and its perimeter
        required: true
        default: rg-terraform-state
        type: string
      location:
        description: Azure region with available Fabric capacity quota
        required: true
        default: centralus
        type: string
      items_repository:
        description: Repository that stores Fabric workspace items
        required: true
        default: fabric-workspace-items
        type: string
      environment_reviewer:
        description: GitHub login that approves platform, test and prod
        required: true
        default: chanderksharma
        type: string
      platform_admin_members:
        description: Comma separated UPNs or object IDs to place in sg-fabric-platform-admins
        required: false
        default: ''
        type: string
      trigger_apply:
        description: Dispatch terraform-apply after bootstrap
        required: true
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: fabric-gh-deployment
  cancel-in-progress: false

env:
  CI: 'true'
  TF_IN_AUTOMATION: 'true'
  GH_TOKEN: ${{ secrets.BOOTSTRAP_GITHUB_TOKEN }}
  FABRIC_GITHUB_PAT: ${{ secrets.FABRIC_GITHUB_PAT }}
  AZURE_BOOTSTRAP_CLIENT_ID: ${{ vars.AZURE_BOOTSTRAP_CLIENT_ID }}
  AZURE_BOOTSTRAP_TENANT_ID: ${{ vars.AZURE_BOOTSTRAP_TENANT_ID }}
  AZURE_BOOTSTRAP_SUBSCRIPTION_ID: ${{ vars.AZURE_BOOTSTRAP_SUBSCRIPTION_ID }}
  INPUT_STORAGE_ACCOUNT_NAME: ${{ inputs.storage_account_name }}
  INPUT_STATE_RESOURCE_GROUP: ${{ inputs.state_resource_group }}
  INPUT_LOCATION: ${{ inputs.location }}
  INPUT_ITEMS_REPOSITORY: ${{ inputs.items_repository }}
  INPUT_ENVIRONMENT_REVIEWER: ${{ inputs.environment_reviewer }}
  INPUT_PLATFORM_ADMIN_MEMBERS: ${{ inputs.platform_admin_members }}

jobs:
  bootstrap:
    name: establish deployment trust
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check seed credentials
        shell: pwsh
        run: |
          $required = @(
              'AZURE_BOOTSTRAP_CLIENT_ID'
              'AZURE_BOOTSTRAP_TENANT_ID'
              'AZURE_BOOTSTRAP_SUBSCRIPTION_ID'
              'GH_TOKEN'
              'FABRIC_GITHUB_PAT'
          )
          $missing = @($required | Where-Object {
              [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missing.Count -gt 0) {
              throw "Required repository variables or secrets are missing: $($missing -join ', ')."
          }

      - name: Azure login with federated bootstrap identity
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_BOOTSTRAP_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_BOOTSTRAP_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_BOOTSTRAP_SUBSCRIPTION_ID }}

      - name: Resolve seed and subscription identifiers
        shell: pwsh
        run: |
          $account = az account show -o json | ConvertFrom-Json
          $callerObjectId = az ad sp show --id $env:AZURE_BOOTSTRAP_CLIENT_ID --query id -o tsv
          if (-not $callerObjectId) {
              throw 'The Azure bootstrap credential does not resolve to a service principal.'
          }
          "BOOTSTRAP_CALLER_OBJECT_ID=$callerObjectId" >> $env:GITHUB_ENV
          "AZURE_TENANT_ID=$($account.tenantId)" >> $env:GITHUB_ENV
          "AZURE_SUBSCRIPTION_ID=$($account.id)" >> $env:GITHUB_ENV

      - name: Check GitHub administration token
        shell: pwsh
        run: |
          $hasAdmin = gh api "repos/$env:GITHUB_REPOSITORY" --jq '.permissions.admin'
          if ($LASTEXITCODE -ne 0 -or $hasAdmin -ne 'true') {
              throw 'BOOTSTRAP_GITHUB_TOKEN must have repository administration access.'
          }

      - name: Create and initialize items repository
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $owner = $env:GITHUB_REPOSITORY_OWNER
          $name = $env:INPUT_ITEMS_REPOSITORY
          $repo = "$owner/$name"

          gh api "repos/$repo" --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            $ownerType = gh api "users/$owner" --jq '.type'
            $endpoint = if ($ownerType -eq 'Organization') { "orgs/$owner/repos" } else { 'user/repos' }
            @{
              name = $name
              private = $true
              auto_init = $true
              description = 'Microsoft Fabric workspace item source'
            } | ConvertTo-Json -Compress |
              gh api --method POST $endpoint --input - | Out-Null
            Write-Host "Created '$repo'."
          }

          $defaultBranch = gh api "repos/$repo" --jq '.default_branch'
          gh api "repos/$repo/git/ref/heads/$defaultBranch" --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("# Fabric workspace items`n"))
            @{ message = 'chore: initialise'; content = $content } | ConvertTo-Json -Compress |
              gh api --method PUT "repos/$repo/contents/README.md" --input - | Out-Null
            $defaultBranch = gh api "repos/$repo" --jq '.default_branch'
          }

          $head = gh api "repos/$repo/git/ref/heads/$defaultBranch" --jq '.object.sha'
          foreach ($branch in @('gh-dev', 'gh-test', 'gh-prod')) {
            gh api "repos/$repo/git/ref/heads/$branch" --silent 2>$null
            if ($LASTEXITCODE -ne 0) {
              @{ ref = "refs/heads/$branch"; sha = $head } | ConvertTo-Json -Compress |
                gh api --method POST "repos/$repo/git/refs" --input - | Out-Null
              Write-Host "Created '$branch'."
            }
          }

          $bootstrapToken = $env:GH_TOKEN
          try {
            $env:GH_TOKEN = $env:FABRIC_GITHUB_PAT
            $canPush = gh api "repos/$repo" --jq '.permissions.push'
            if ($canPush -ne 'true') {
              throw 'FABRIC_GITHUB_PAT does not have write access to the items repository.'
            }
          }
          finally {
            $env:GH_TOKEN = $bootstrapToken
          }

      - name: Create state and permanent OIDC identity
        shell: pwsh
        run: |
          $adminMembers = @()
          if ($env:INPUT_PLATFORM_ADMIN_MEMBERS) {
              $adminMembers = $env:INPUT_PLATFORM_ADMIN_MEMBERS -split ',' |
                  ForEach-Object { $_.Trim() } |
                  Where-Object { $_ }
          }

          ./scripts/bootstrap.ps1 `
              -Lane gh `
              -GitHubOrg $env:GITHUB_REPOSITORY_OWNER `
              -GitHubOrgId $env:GITHUB_REPOSITORY_OWNER_ID `
              -GitHubRepo ($env:GITHUB_REPOSITORY.Split('/')[1]) `
              -GitHubRepoId $env:GITHUB_REPOSITORY_ID `
              -SubscriptionId $env:AZURE_SUBSCRIPTION_ID `
              -Location $env:INPUT_LOCATION `
              -StateResourceGroup $env:INPUT_STATE_RESOURCE_GROUP `
              -StateStorageAccount $env:INPUT_STORAGE_ACCOUNT_NAME `
              -CreateGroups `
              -CallerObjectId $env:BOOTSTRAP_CALLER_OBJECT_ID `
              -CallerPrincipalType ServicePrincipal `
              -PlatformAdminMembers $adminMembers

      - name: Resolve permanent deployment identity
        shell: pwsh
        run: |
          $clientId = az ad app list --display-name sp-fabric-cicd-gh --query '[0].appId' -o tsv
          $objectId = az ad sp list --filter "appId eq '$clientId'" --query '[0].id' -o tsv
          if (-not $clientId -or -not $objectId) {
              throw 'The permanent deployment service principal was not created.'
          }
          "DEPLOYMENT_CLIENT_ID=$clientId" >> $env:GITHUB_ENV
          "DEPLOYMENT_OBJECT_ID=$objectId" >> $env:GITHUB_ENV

      - name: Create GitHub environments and protections
        shell: pwsh
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $reviewerLogin = $env:INPUT_ENVIRONMENT_REVIEWER
          $reviewerId = gh api "users/$reviewerLogin" --jq '.id' 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $reviewerId) {
              throw "GitHub reviewer '$reviewerLogin' was not found or is not visible to BOOTSTRAP_GITHUB_TOKEN."
          }

          foreach ($environment in @('platform', 'dev', 'test', 'prod')) {
              $protected = $environment -ne 'dev'
              $reviewers = @()
              if ($protected) {
                  $reviewers = @(@{ type = 'User'; id = [long]$reviewerId })
              }

              $body = @{
                  wait_timer = 0
                  prevent_self_review = $false
                  reviewers = $reviewers
                  deployment_branch_policy = if ($environment -eq 'prod') {
                      @{ protected_branches = $false; custom_branch_policies = $true }
                  }
                  else { $null }
              } | ConvertTo-Json -Depth 6 -Compress

              $body | gh api --method PUT "repos/$repo/environments/$environment" --input - | Out-Null
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to configure GitHub environment '$environment'."
              }
              Write-Host "Configured environment '$environment'."
          }

          $policiesJson = gh api "repos/$repo/environments/prod/deployment-branch-policies"
          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to read prod deployment branch policies.'
          }
          $policies = $policiesJson | ConvertFrom-Json
          if (-not ($policies.branch_policies | Where-Object { $_.name -eq 'main' })) {
              @{ name = 'main'; type = 'branch' } | ConvertTo-Json -Compress |
                  gh api --method POST "repos/$repo/environments/prod/deployment-branch-policies" --input - | Out-Null
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to create the prod deployment policy for 'main'."
              }
          }

      - name: Set GitHub Actions variables
        shell: pwsh
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $variables = [ordered]@{
              AZURE_CLIENT_ID = $env:DEPLOYMENT_CLIENT_ID
              AZURE_TENANT_ID = $env:AZURE_TENANT_ID
              AZURE_SUBSCRIPTION_ID = $env:AZURE_SUBSCRIPTION_ID
              FABRIC_CICD_SP_OBJECT_ID = $env:DEPLOYMENT_OBJECT_ID
              FABRIC_ITEMS_OWNER = $env:GITHUB_REPOSITORY_OWNER
              FABRIC_ITEMS_REPOSITORY = $env:INPUT_ITEMS_REPOSITORY
              FABRIC_ADMIN_GROUP_ID = $env:FABRIC_ADMIN_GROUP_ID
              FABRIC_ENGINEER_GROUP_ID = $env:FABRIC_ENGINEER_GROUP_ID
              FABRIC_ANALYST_GROUP_ID = $env:FABRIC_ANALYST_GROUP_ID
              TF_STATE_RESOURCE_GROUP = $env:INPUT_STATE_RESOURCE_GROUP
              TF_STATE_STORAGE_ACCOUNT = $env:INPUT_STORAGE_ACCOUNT_NAME
          }

          foreach ($entry in $variables.GetEnumerator()) {
              gh variable set $entry.Key --body $entry.Value --repo $repo
              foreach ($environment in @('platform', 'dev', 'test', 'prod')) {
                  gh variable set $entry.Key --body $entry.Value --env $environment --repo $repo
              }
          }

      - name: Dispatch Terraform deployment
        if: inputs.trigger_apply
        shell: pwsh
        run: gh workflow run terraform-apply.yml --ref '${{ github.event.repository.default_branch }}'

      - name: Bootstrap summary
        shell: pwsh
        run: |
          @(
              '## Bootstrap complete'
              ''
              "Permanent deployment identity: ``$env:DEPLOYMENT_CLIENT_ID``"
              "State: ``$env:INPUT_STORAGE_ACCOUNT_NAME/tfstate-gh``"
              ''
              'Still manual: run ``scripts/Enable-FabricGitIntegration.ps1`` from a workstation as a Fabric administrator. Git integration stays disabled until you do.'
              ''
              "Remove ``BOOTSTRAP_GITHUB_TOKEN`` and revoke the bootstrap service principal's repository federation when bootstrap access is no longer needed."
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8